<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Whack-a-Mole</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#1a2a1a;--surface:#22332a;--hole:#0d1a10;
    --grass:#2d5a27;--grass2:#3a7032;
    --mole:#c8843a;--mole-dark:#8b5a24;--mole-face:#f5d5a0;
    --text:#e8f5e0;--text-lo:#7aaa6a;--accent:#7fff50;
    --danger:#ff5252;--gold:#ffd700;
    --font-head:'Fredoka One',cursive;--font:'Nunito',sans-serif;
    --radius:50%;
  }
  body{font-family:var(--font);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 16px 40px;color:var(--text);user-select:none;}

  h1{font-family:var(--font-head);font-size:2.8rem;color:var(--accent);text-shadow:0 3px 0 rgba(0,0,0,.4);margin-bottom:4px;letter-spacing:.03em;}
  .tagline{font-size:.85rem;color:var(--text-lo);letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px;}

  /* HUD */
  .hud{display:flex;gap:28px;margin-bottom:20px;}
  .stat{text-align:center;background:var(--surface);border-radius:10px;padding:8px 20px;}
  .stat-val{font-family:var(--font-head);font-size:1.8rem;color:var(--accent);}
  .stat-lbl{font-size:.72rem;color:var(--text-lo);text-transform:uppercase;letter-spacing:.08em;}
  .timer-low .stat-val{color:var(--danger);}

  /* Start button */
  .btn-start{font-family:var(--font-head);font-size:1.2rem;padding:12px 36px;border:none;border-radius:30px;background:var(--accent);color:#0d1a10;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s;margin-bottom:20px;letter-spacing:.04em;}
  .btn-start:hover{filter:brightness(1.1);}
  .btn-start:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4);}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}

  /* Hole */
  .hole{width:100px;height:100px;background:var(--hole);border-radius:50%;overflow:hidden;position:relative;cursor:pointer;box-shadow:inset 0 8px 20px rgba(0,0,0,.7);border:4px solid var(--grass);}
  .hole::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:36px;background:var(--grass);border-radius:0 0 50% 50%;}

  /* Mole */
  .mole{position:absolute;bottom:-100%;left:50%;transform:translateX(-50%);width:76px;height:76px;z-index:2;transition:bottom .18s cubic-bezier(.2,1.6,.4,1);pointer-events:none;}
  .hole.up .mole{bottom:0;}
  .mole-body{width:76px;height:76px;background:var(--mole);border-radius:50% 50% 40% 40%;position:relative;display:flex;align-items:center;justify-content:center;font-size:2.4rem;line-height:1;}
  /* Whack flash */
  .hole.whacked .mole-body{background:#ff9a3c;}
  .hole.whacked::before{content:'💥';position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:1.6rem;z-index:5;animation:boom .3s ease forwards;}
  @keyframes boom{from{opacity:1;transform:translateX(-50%) scale(1);}to{opacity:0;transform:translateX(-50%) scale(2.5);}}

  /* Grass band */
  .grass-band{width:100%;background:var(--grass2);height:12px;border-radius:6px;margin-bottom:6px;}

  /* Score popup */
  @keyframes floatUp{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-60px);}}
  .popup{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--font-head);font-size:1.4rem;color:var(--gold);z-index:10;pointer-events:none;animation:floatUp .6s ease forwards;}

  /* High score overlay */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;}
  .overlay.hidden{display:none!important;}
  .modal{background:var(--surface);border-radius:16px;padding:28px 32px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .modal h2{font-family:var(--font-head);font-size:1.8rem;color:var(--accent);margin-bottom:6px;}
  .modal .final-score{font-size:3rem;font-family:var(--font-head);color:var(--gold);margin:10px 0;}
  .name-input{width:100%;font-family:var(--font);font-size:1rem;padding:9px 14px;border-radius:8px;border:1px solid #3a5a3a;background:#0d1a10;color:var(--text);margin:12px 0 4px;outline:none;}
  .name-input:focus{border-color:var(--accent);}
  .btn-submit{font-family:var(--font-head);font-size:1rem;padding:9px 26px;border:none;border-radius:20px;background:var(--accent);color:#0d1a10;cursor:pointer;margin-top:8px;}
  .btn-skip{background:none;border:none;color:var(--text-lo);font-family:var(--font);font-size:.85rem;cursor:pointer;display:block;margin:8px auto 12px;text-decoration:underline;}
  .hs-list{margin-top:16px;text-align:left;}
  .hs-list h3{font-family:var(--font-head);font-size:1.1rem;color:var(--accent);margin-bottom:8px;}
  .hs-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #2a4a2a;font-size:.9rem;}
  .hs-row:last-child{border:none;}
  .hs-rank{color:var(--text-lo);font-weight:700;width:24px;}
  .hs-name{flex:1;padding:0 8px;}
  .hs-pts{font-family:var(--font-head);color:var(--gold);}
  .btn-play-again{font-family:var(--font-head);font-size:1rem;padding:10px 28px;border:none;border-radius:20px;background:var(--accent);color:#0d1a10;cursor:pointer;margin-top:14px;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<h1>🔨 Whack-a-Mole</h1>
<p class="tagline">Click the moles before they hide!</p>

<div class="hud">
  <div class="stat" id="scoreBox"><div class="stat-val" id="scoreDisplay">0</div><div class="stat-lbl">Score</div></div>
  <div class="stat" id="timerBox"><div class="stat-val" id="timerDisplay">30</div><div class="stat-lbl">Seconds</div></div>
</div>

<button class="btn-start" id="startBtn">▶ Start Game</button>

<div class="grid" id="grid"></div>
<div class="grass-band"></div>

<!-- End-game overlay -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2>Time's Up!</h2>
    <div class="final-score" id="finalScore">0</div>
    <p id="newHsMsg" class="hidden" style="color:var(--gold);font-weight:700;margin-bottom:4px;">🏆 New High Score!</p>
    <input class="name-input hidden" id="nameInput" maxlength="16" placeholder="Enter your name…"/>
    <button class="btn-submit hidden" id="submitName">Save Score</button>
    <button class="btn-skip hidden" id="skipName">Skip</button>
    <div class="hs-list" id="hsList"></div>
    <button class="btn-play-again" id="playAgain">Play Again</button>
  </div>
</div>

<script>
'use strict';
const HOLES    = 9;
const DURATION = 30;
const MAX_HS   = 5;
const MOLE_EMO = ['🦔','🐭','🐹','🐱'];

let score      = 0;
let timeLeft   = DURATION;
let running    = false;
let moleTimers = [];
let countdown  = null;
let highScores = JSON.parse(localStorage.getItem('wam_hs') || '[]');

const gridEl       = document.getElementById('grid');
const scoreDisplay = document.getElementById('scoreDisplay');
const timerDisplay = document.getElementById('timerDisplay');
const startBtn     = document.getElementById('startBtn');
const timerBox     = document.getElementById('timerBox');
const overlay      = document.getElementById('overlay');
const finalScore   = document.getElementById('finalScore');
const newHsMsg     = document.getElementById('newHsMsg');
const nameInput    = document.getElementById('nameInput');
const submitName   = document.getElementById('submitName');
const skipName     = document.getElementById('skipName');
const hsList       = document.getElementById('hsList');
const playAgain    = document.getElementById('playAgain');

// Build grid
const holes = [];
for (let i = 0; i < HOLES; i++) {
  const hole = document.createElement('div');
  hole.className = 'hole';
  const mole = document.createElement('div');
  mole.className = 'mole';
  const body = document.createElement('div');
  body.className = 'mole-body';
  body.textContent = MOLE_EMO[Math.floor(Math.random() * MOLE_EMO.length)];
  mole.appendChild(body);
  hole.appendChild(mole);
  hole.addEventListener('click', () => whack(hole));
  gridEl.appendChild(hole);
  holes.push(hole);
}

function whack(hole) {
  if (!running || !hole.classList.contains('up')) return;
  score++;
  scoreDisplay.textContent = score;
  hole.classList.remove('up');
  hole.classList.add('whacked');

  // Floating score popup
  const pop = document.createElement('div');
  pop.className = 'popup'; pop.textContent = '+1';
  hole.appendChild(pop);
  setTimeout(() => pop.remove(), 600);
  setTimeout(() => hole.classList.remove('whacked'), 300);
}

function showMole() {
  const available = holes.filter(h => !h.classList.contains('up'));
  if (!available.length) return;
  const hole = available[Math.floor(Math.random() * available.length)];
  // Randomise emoji each time
  hole.querySelector('.mole-body').textContent = MOLE_EMO[Math.floor(Math.random() * MOLE_EMO.length)];
  hole.classList.add('up');

  const upTime = 600 + Math.random() * 1000;
  const t = setTimeout(() => hole.classList.remove('up'), upTime);
  moleTimers.push(t);
}

function startGame() {
  score = 0; timeLeft = DURATION; running = true;
  scoreDisplay.textContent = 0;
  timerDisplay.textContent = DURATION;
  timerBox.classList.remove('timer-low');
  startBtn.classList.add('hidden');
  holes.forEach(h => { h.classList.remove('up','whacked'); });

  // Spawn moles at random intervals
  function spawnLoop() {
    if (!running) return;
    showMole();
    const delay = 500 + Math.random() * 800;
    moleTimers.push(setTimeout(spawnLoop, delay));
  }
  spawnLoop();

  // Countdown
  countdown = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = timeLeft;
    if (timeLeft <= 5) timerBox.classList.add('timer-low');
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  running = false;
  clearInterval(countdown);
  moleTimers.forEach(clearTimeout); moleTimers = [];
  holes.forEach(h => h.classList.remove('up'));
  showEndScreen();
}

function showEndScreen() {
  finalScore.textContent = score;
  const isHS = isHighScore(score);
  newHsMsg.classList.toggle('hidden', !isHS);
  nameInput.classList.toggle('hidden', !isHS);
  submitName.classList.toggle('hidden', !isHS);
  skipName.classList.toggle('hidden', !isHS);
  renderHsList();
  overlay.classList.remove('hidden');
}

function isHighScore(s) {
  return highScores.length < MAX_HS || s > highScores[highScores.length - 1]?.score;
}

function saveScore(name) {
  highScores.push({ name: name || 'Anonymous', score });
  highScores.sort((a, b) => b.score - a.score);
  highScores = highScores.slice(0, MAX_HS);
  localStorage.setItem('wam_hs', JSON.stringify(highScores));
  renderHsList();
}

function renderHsList() {
  hsList.innerHTML = '<h3>🏆 High Scores</h3>';
  if (!highScores.length) { hsList.innerHTML += '<p style="color:var(--text-lo);font-size:.85rem">No scores yet.</p>'; return; }
  highScores.forEach((hs, i) => {
    const row = document.createElement('div');
    row.className = 'hs-row';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
    row.innerHTML = `<span class="hs-rank">${medal}</span><span class="hs-name">${hs.name}</span><span class="hs-pts">${hs.score}</span>`;
    hsList.appendChild(row);
  });
}

submitName.addEventListener('click', () => {
  saveScore(nameInput.value.trim());
  nameInput.classList.add('hidden');
  submitName.classList.add('hidden');
  skipName.classList.add('hidden');
  newHsMsg.classList.add('hidden');
});

skipName.addEventListener('click', () => {
  nameInput.classList.add('hidden');
  submitName.classList.add('hidden');
  skipName.classList.add('hidden');
  newHsMsg.classList.add('hidden');
});

playAgain.addEventListener('click', () => {
  overlay.classList.add('hidden');
  startBtn.classList.remove('hidden');
});

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
