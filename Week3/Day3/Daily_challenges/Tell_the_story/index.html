<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Challenge: Mad Libs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <h1>🎭 Mad Libs</h1>

        <form id="libform">
            <div class="field">
                <label for="noun">Noun:</label>
                <input type="text" id="noun" placeholder="e.g. banana">
            </div>
            <div class="field">
                <label for="adjective">Adjective:</label>
                <input type="text" id="adjective" placeholder="e.g. fluffy">
            </div>
            <div class="field">
                <label for="person">Someone's Name:</label>
                <input type="text" id="person" placeholder="e.g. Alice">
            </div>
            <div class="field">
                <label for="verb">Verb:</label>
                <input type="text" id="verb" placeholder="e.g. jumped">
            </div>
            <div class="field">
                <label for="place">A Place:</label>
                <input type="text" id="place" placeholder="e.g. the moon">
            </div>

            <div class="buttons">
                <button type="submit" id="lib-button">🎲 Lib it!</button>
                <button type="button" id="shuffle-button" style="display:none;">🔀 Shuffle Story</button>
            </div>
        </form>

        <div id="story-container" style="display:none;">
            <h2>Generated Story:</h2>
            <p id="story"></p>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
