<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Letters Only Input</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <h1>Letters Only ✏️</h1>
        <p class="subtitle">Type anything — only letters will be accepted.</p>

        <div class="input-wrapper">
            <input type="text" id="letterInput" placeholder="Type letters here..." autocomplete="off" />
            <span id="indicator"></span>
        </div>

        <p id="feedback"></p>
        <p id="charCount">Characters: 0</p>
    </div>

    <script src="main.js"></script>
</body>

</html>
