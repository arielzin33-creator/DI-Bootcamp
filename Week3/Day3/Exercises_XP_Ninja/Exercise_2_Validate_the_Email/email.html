<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Email Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .error {
            color: red;
            margin-top: 8px;
        }
        
        .success {
            color: green;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <h2>Email Validation</h2>

    <form id="emailForm">
        <label for="email">Enter your email:</label><br><br>
        <input type="email" id="emailInput" placeholder="example@domain.com" required>
        <br><br>
        <input type="submit" value="Submit">
    </form>

    <p id="message"></p>

    <script src="email.js"></script>
</body>

</html>
