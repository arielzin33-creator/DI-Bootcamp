# Render Blueprint -- optional. You can create the three services by hand in the
# dashboard exactly as the README describes; committing this file lets Render create
# all of them at once instead (Dashboard > New > Blueprint).
#
# Render redeploys automatically on every push to the connected branch.

databases:
  - name: storyapp-db
    databaseName: storyapp
    user: storyapp
    plan: free

services:
  # ----------------------------------------------------------------- backend ----
  - type: web
    name: storyapp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: storyapp-db
          # `connectionString` is the INTERNAL URL: it stays inside Render's network,
          # which is both faster and not exposed to the internet.
          property: connectionString
      # Generated once by Render and then kept -- never commit real secrets.
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      # Must be the exact frontend origin: a credentialed request cannot use "*".
      # Update this to your static site's URL after its first deploy.
      - key: CORS_ORIGIN
        value: https://storyapp-frontend.onrender.com

  # ---------------------------------------------------------------- frontend ----
  - type: web
    name: storyapp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time -- changing it needs a redeploy.
      - key: VITE_API_URL
        value: https://storyapp-backend.onrender.com/api
    routes:
      # Single-page app: every unknown path must fall back to index.html, otherwise
      # reloading /stories/3 returns a 404 from the static file server.
      - type: rewrite
        source: /*
        destination: /index.html
