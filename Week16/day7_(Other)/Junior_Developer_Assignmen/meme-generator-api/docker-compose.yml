services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memegen}
      POSTGRES_USER: ${POSTGRES_USER:-memegen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memegen_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memegen_user} -d ${POSTGRES_DB:-memegen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-change-me}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      POSTGRES_DB: ${POSTGRES_DB:-memegen}
      POSTGRES_USER: ${POSTGRES_USER:-memegen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memegen_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin12345}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
