<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .alert { padding: 10px; margin-top: 15px; border-radius: 4px; display: none; font-weight: bold; text-align: center; }
        .success { background-color: #d4edda; color: #155724; }
        .danger { background-color: #f8d7da; color: #721c24; }
        .nav-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Register Profile</h2>
    <form id="registerForm">
        <input type="text" id="name" placeholder="Name" oninput="validateForm()">
        <input type="text" id="lastName" placeholder="Last Name" oninput="validateForm()">
        <input type="email" id="email" placeholder="Email" oninput="validateForm()">
        <input type="text" id="username" placeholder="Username" oninput="validateForm()">
        <input type="password" id="password" placeholder="Password" oninput="validateForm()">
        <button type="submit" id="submitBtn" disabled>Register</button>
    </form>
    <div id="responseAlert" class="alert"></div>
    <a href="/login.html" class="nav-link">Already registered? Login here</a>
</div>

<script>
    function validateForm() {
        const name = document.getElementById('name').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        
        const submitBtn = document.getElementById('submitBtn');
        if (name && lastName && email && username && password) {
            submitBtn.disabled = false;
        } else {
            submitBtn.disabled = true;
        }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        const alertBox = document.getElementById('responseAlert');
        alertBox.style.display = 'none';

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, lastName, email, username, password })
            });
            const data = await response.json();

            alertBox.style.display = 'block';
            if (response.status === 201) {
                alertBox.className = 'alert success';
                alertBox.innerText = data.message || 'Registered Successfully!';
                document.getElementById('registerForm').reset();
                validateForm();
            } else {
                alertBox.className = 'alert danger';
                alertBox.innerText = data.message || data.error || 'Registration failed';
            }
        } catch (error) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert danger';
            alertBox.innerText = 'Network communication failure occurred';
        }
    });
</script>
</body>
</html>
