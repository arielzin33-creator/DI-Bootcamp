<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .alert { padding: 10px; margin-top: 15px; border-radius: 4px; display: none; font-weight: bold; text-align: center; }
        .success { background-color: #d4edda; color: #155724; }
        .danger { background-color: #f8d7da; color: #721c24; }
        .nav-link { display: block; text-align: center; margin-top: 15px; color: #28a745; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Secure Login</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" oninput="validateForm()">
        <input type="password" id="password" placeholder="Password" oninput="validateForm()">
        <button type="submit" id="submitBtn" disabled>Login</button>
    </form>
    <div id="responseAlert" class="alert"></div>
    <a href="/register.html" class="nav-link">New user? Create an account</a>
</div>

<script>
    function validateForm() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        
        const submitBtn = document.getElementById('submitBtn');
        if (username && password) {
            submitBtn.disabled = false;
        } else {
            submitBtn.disabled = true;
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        const alertBox = document.getElementById('responseAlert');
        alertBox.style.display = 'none';

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            alertBox.style.display = 'block';
            if (response.status === 200) {
                alertBox.className = 'alert success';
                alertBox.innerText = data.message || 'Logged in successfully';
            } else {
                alertBox.className = 'alert danger';
                alertBox.innerText = data.message || data.error || 'Authentication rejected';
            }
        } catch (error) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert danger';
            alertBox.innerText = 'Network communication failure occurred';
        }
    });
</script>
</body>
</html>
